# Runs the Android app in an emulator, drives it with remote-control keys and saves screenshots.
# Start it from the Actions tab, or it runs on pull requests that touch the app.
name: Android device test

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the debug app
        run: |
          npm ci
          VITE_TRACE_FOCUS=1 npm run build
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../OrbitTV-debug.apk
      - name: Test playlist and videos
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          .github/scripts/make-fixtures.sh "$RUNNER_TEMP/fixtures"
          (cd "$RUNNER_TEMP/fixtures" && nohup python3 -m http.server 8099 > /dev/null 2>&1 &)
          mkdir -p "$RUNNER_TEMP/xtream" && (nohup python3 .github/scripts/xtream-mock.py "$RUNNER_TEMP/xtream" 8098 > "$RUNNER_TEMP/xtream.log" 2>&1 &)
          for i in $(seq 1 90); do grep -q MB "$RUNNER_TEMP/xtream.log" && break; sleep 2; done; cat "$RUNNER_TEMP/xtream.log"
      - name: Run in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_c
          ram-size: 1536M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: .github/scripts/device-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test
          path: device-test/
      # Also keep the results on a branch of their own, so they can be fetched with git.
      - name: Save results to the device-test-results branch
        if: always()
        run: |
          cd device-test
          git init -q -b device-test-results
          git -c user.name=orbit-ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=orbit-ci -c user.email=ci@users.noreply.github.com commit -qm "Device test ${{ github.run_id }} for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" device-test-results
