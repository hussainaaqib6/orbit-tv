# Builds an unsigned iPhone/iPad app (.ipa). Sign and install it with Sideloadly or AltStore
# using your Apple ID, or open the project in Xcode on a Mac.
name: Build iOS app (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Copy web app into the iOS project
        run: npx cap sync ios
      - name: Build
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry OrbitTV-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitTV-ios-unsigned
          path: OrbitTV-unsigned.ipa
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Orbit TV (latest build)
          prerelease: true
          make_latest: false
          files: OrbitTV-unsigned.ipa
