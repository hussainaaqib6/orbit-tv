<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060B">
<title>Orbit TV</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside class="rail" aria-label="Main">
  <div class="brand" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="6" fill="currentColor"/><ellipse cx="16" cy="16" rx="14" ry="6" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(-25 16 16)"/></svg></div>
  <button class="nav" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button class="nav" data-v="live"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg>Live</button>
  <button class="nav sec2" data-v="guide"><svg viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18M9 5v4M15 12v4M7 19v0"/></svg>Guide</button>
  <button class="nav sec2" data-v="sports"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6c3.5 3.5 3.5 9.3 0 12.8M18.4 5.6c-3.5 3.5-3.5 9.3 0 12.8"/></svg>Sports</button>
  <button class="nav" data-v="movies"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>Movies</button>
  <button class="nav" data-v="series"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="15" height="13" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h12"/></svg>Series</button>
  <button class="nav sec2" data-v="favs"><svg viewBox="0 0 24 24"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4l-5.5 2.9 1-6.2L3 9.7l6.2-.9z"/></svg>Favourites</button>
  <button class="nav sec2" data-v="library"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>Library</button>
  <button class="nav sec2" data-v="multi"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="3" y="13" width="8" height="7" rx="1"/><rect x="13" y="13" width="8" height="7" rx="1"/></svg>Multiview</button>
  <button class="nav" data-v="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</button>
  <button class="nav more-btn" data-more aria-label="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
  <span class="grow"></span>
  <button class="nav sec2" data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Settings</button>
  <div class="clock" id="clock"></div>
</aside>

<main id="view" tabindex="-1"></main>

<div id="player" class="player" hidden tabindex="-1">
  <video id="opv" controls playsinline></video>
  <div class="vmsg" id="opmsg" hidden></div>
  <div class="ptop">
    <button class="pbtn" id="opclose" aria-label="Close player">←</button>
    <div class="ptitle"><b id="optitle"></b><span id="opsub"></span></div>
    <button class="pbtn" id="opprev" aria-label="Previous channel">▲</button>
    <button class="pbtn" id="opnext" aria-label="Next channel">▼</button>
    <button class="pbtn" id="opcc" aria-label="Subtitles">CC</button>
    <button class="pbtn" id="opcast" aria-label="Cast" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18a3 3 0 0 1 3 3M3 14a7 7 0 0 1 7 7M3 10a11 11 0 0 1 11 11"/><path d="M3 7V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg></button>
    <button class="pbtn" id="opfav" aria-label="Favourite">★</button>
    <button class="pbtn" id="opfs" aria-label="Full screen">⛶</button>
  </div>
  <div class="lcap" id="lcap" hidden aria-live="polite"></div>
  <div class="pinfo" id="opinfo"></div>
  <div class="opbar" id="opbar" hidden><span id="opcur">0:00</span><span class="bar"><i id="opprog"></i></span><span id="opdur">0:00</span><small class="dim">▲ Subtitles &amp; options</small></div>
</div>

<div id="modal" class="modal" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="status" class="status" hidden></div>

<script src="vendor/hls.min.js"></script>
<script src="vendor/mpegts.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
